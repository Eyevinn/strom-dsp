[workspace]
resolver = "2"
members = ["crates/strom-dsp", "crates/gst-plugin-stromdsp", "crates/strom-dsp-harness"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Eyevinn Technology"]
repository = "https://github.com/Eyevinn/strom-dsp"
# 1.89: needed by `fearless_simd` (planned SIMD pass); checked in CI.
rust-version = "1.89"

[workspace.dependencies]
strom-dsp = { path = "crates/strom-dsp" }

# Release: whole-program optimisation for the DSP hot loops. Generic target
# only; never `target-cpu=native` (the plugin ships as one binary).
#
# `panic` stays at the default `unwind` on purpose: gstreamer-rs catches a
# panic in an element vfunc and turns it into an element error, so the host
# (Strom) survives. `panic = "abort"` would kill the whole host process.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# Benchmarks inherit the release settings above (cargo default); line tables
# keep profiler and callgrind output attributable to source lines.
[profile.bench]
debug = "line-tables-only"

# The test suite runs long signals (seconds of audio, THD and loudness grids,
# proptests). Unoptimised it takes over 10 minutes; opt-level 2 keeps
# debug-assertions and overflow checks on but makes it practical in CI.
# Line tables are enough for backtraces with file and line, and build and
# link about a third faster than full debug info.
[profile.test]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
