# cargo-deny configuration: licence allowlist only. Anything not listed fails.
[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
]

[[licenses.clarify]]
# Workspace crates are dual licensed MIT OR Apache-2.0 (see Cargo.toml).
crate = "strom-dsp"
expression = "MIT OR Apache-2.0"
license-files = []
