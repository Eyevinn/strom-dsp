# cargo-deny configuration: licence allowlist only. Anything not listed fails.
[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
# The allowlist is a policy; licences that do not occur today are fine.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
]
