[package]
name = "strom-dsp-harness"
description = "Measurement harness for strom-dsp: fixed synthetic signals through a processor configuration, a fixed set of numbers, and a checked-in baseline. Test and benchmark support only; not part of the plugin."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
strom-dsp = { workspace = true }
# Spectra for the aliasing, IMD and NMR metrics (already used by strom-dsp).
realfft = "3.5"
# Reading and writing the baseline file (already in the tree via criterion).
serde_json = "1"
