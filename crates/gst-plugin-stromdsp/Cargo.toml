[package]
name = "gst-plugin-stromdsp"
description = "GStreamer elements (gate, compressor, equalizer, limiter) built on strom-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# gstreamer-rs 0.25 requires Rust 1.92 (the library crate alone needs 1.89).
rust-version = "1.92"

[lib]
name = "gststromdsp"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
strom-dsp.workspace = true
gst = { package = "gstreamer", version = "0.25", features = ["v1_22"] }
gst-base = { package = "gstreamer-base", version = "0.25", features = ["v1_22"] }
gst-audio = { package = "gstreamer-audio", version = "0.25", features = ["v1_22"] }

[dev-dependencies]
gst-check = { package = "gstreamer-check", version = "0.25", features = ["v1_22"] }

[build-dependencies]
gst-plugin-version-helper = "0.8"
