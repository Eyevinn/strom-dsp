[package]
name = "strom-dsp"
description = "Clean-room real-time audio DSP: gate, compressor, parametric EQ, lookahead limiter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Test-only: RealtimeSanitizer checks of `process`/`set_params`
# (`tests/rtsan.rs`). Run with `RTSAN_ENABLE=1`, see docs/PERFORMANCE.md.
# The library code never uses the dependency; without RTSAN_ENABLE it is a no-op.
rtsan = ["dep:rtsan-standalone"]
# Bench-only: instruction-count benchmarks (`benches/strip_gungraun.rs`).
# Needs Valgrind and a matching `gungraun-runner` (Linux only), see
# docs/PERFORMANCE.md.
gungraun = ["dep:gungraun"]

[dependencies]
# Portable SIMD with runtime dispatch (SSE4.2/AVX2/AVX-512/NEON), safe API.
fearless_simd = "1.2"
# Reused because they are hard to get right (phase 1b spec 1.2), always
# wrapped behind our own types:
# BS.1770 loudness / LRA / true peak (EBU R 128 measurement).
ebur128 = "0.1"
# Real FFT for the STFT framework (pulls in rustfft).
realfft = "3.5"
# Arbitrary-ratio resampling (ducker key at a different rate than the programme).
rubato = "5"
# Optional so they can be gated by features (dev-dependencies cannot be
# optional). Neither is used by the library code itself.
rtsan-standalone = { version = "0.3", optional = true }
# Keep in lockstep with the `gungraun-runner` version installed in CI.
gungraun = { version = "=0.20.0", optional = true }

[dev-dependencies]
# Tests only: `Level::fallback()` (scalar level), to compare every vector path
# against it. Dev-dependency features do not reach normal (release) builds.
fearless_simd = { version = "1.2", features = ["force_support_fallback"] }
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "strip"
harness = false

[[bench]]
name = "strip_gungraun"
harness = false
required-features = ["gungraun"]

[[test]]
name = "rtsan"
required-features = ["rtsan"]

[[bench]]
name = "filters"
harness = false

[[bench]]
name = "sampling"
harness = false

[[bench]]
name = "meter"
harness = false

[[bench]]
name = "sidechain"
harness = false

[[bench]]
name = "dynamics_1b"
harness = false

[[bench]]
name = "channel_tools"
harness = false
